<tspan x="24" y="406.7">Dirección y contacto de ejemplo no</tspan>
<tspan x="24" y="432.8">disponibles.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e11" data-source="ORI-COPY-S12" x="24" y="490.9" font-family="Segoe UI" font-size="22" font-weight="700" fill="#20251E">
<tspan x="24" y="490.9">Horario del local pendiente.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e12" data-source="ORI-COPY-S12" x="24" y="536.8" font-family="Segoe UI" font-size="22" font-weight="700" fill="#20251E">
<tspan x="24" y="536.8">Horario de cocina pendiente.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e13" data-source="ORI-COPY-H04-06" x="24" y="598.7" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="598.7">Puedes consultar la carta cuando la</tspan>
<tspan x="24" y="624.8">cocina está cerrada. Las bebidas se sirven</tspan>
<tspan x="24" y="650.9">durante el horario del local. La</tspan>
<tspan x="24" y="677.0">disponibilidad de los platos se confirma</tspan>
<tspan x="24" y="703.1">para cada servicio.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e14" data-source="ORI-COPY-H04-07" x="24" y="761.2" font-family="Segoe UI" font-size="18" font-weight="700" fill="#20251E">
<tspan x="24" y="761.2">Mesas pequeñas y una mesa de seis.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e15" data-source="ORI-COPY-H04-07" x="24" y="795.3" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="795.3">Para grupos de hasta seis, la distribución</tspan>
<tspan x="24" y="821.4">necesita confirmación.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e16" data-source="ORI-COPY-H04-08" x="24" y="875.5" font-family="Segoe UI" font-size="18" font-weight="700" fill="#20251E">
<tspan x="24" y="875.5">Hay un escalón en la entrada.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e17" data-source="ORI-COPY-H04-08" x="24" y="909.6" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="909.6">Las medidas de paso y del aseo están</tspan>
<tspan x="24" y="935.7">pendientes.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e18" data-source="ORI-COPY-H04-09" x="24" y="989.8" font-family="Segoe UI" font-size="18" font-weight="700" fill="#20251E">
<tspan x="24" y="989.8">Las condiciones para venir con</tspan>
<tspan x="24" y="1015.9">animales están pendientes.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e19" data-source="ORI-VISIT-03C" x="24" y="1066.0" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="1066.0">No hay terraza en este caso de ejemplo.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e20" data-source="ORI-VISIT-03E" x="24" y="1108.1" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="1108.1">No hay servicio de pedidos para llevar en</tspan>
<tspan x="24" y="1134.2">este caso.</tspan>
</text>
<text id="UI-T-VISIT-PENDING-e21" data-source="ORI-COPY-H04-10" x="24" y="1192.3" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="1192.3">Esta demostración no permite llamar,</tspan>
<tspan x="24" y="1218.4">abrir un mapa ni reservar una mesa.</tspan>
</text>
