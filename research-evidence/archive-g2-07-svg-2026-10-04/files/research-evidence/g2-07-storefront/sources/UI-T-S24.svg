<g id="offer-02-V02-UI-T-S24-e15" data-source="ORI-DISH-02-V02">
<rect id="UI-T-S24-e16" x="24" y="613.9" width="342" height="1" rx="0" fill="#CCC6B8"/>
<text id="UI-T-S24-e17" data-source="ORI-DISH-02-V02" x="24" y="671.9" font-family="Arial Black" font-size="30" font-weight="900" fill="#20251E">
<tspan x="24" y="671.9">Berenjena asada</tspan>
<tspan x="24" y="707.9">con aceite de</tspan>
<tspan x="24" y="743.9">limón, miel y</tspan>
<tspan x="24" y="779.9">avellanas tostadas</tspan>
</text>
<text id="UI-T-S24-e18" data-source="ORI-DISH-02-V02" x="24" y="819.9" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="819.9">La misma berenjena con aceite de limón</tspan>
<tspan x="24" y="846.0">en lugar de yogur. Conserva la miel y las</tspan>
<tspan x="24" y="872.1">avellanas.</tspan>
</text>
<text id="UI-T-S24-e19" data-source="ORI-DISH-02-V02" x="24" y="922.2" font-family="Segoe UI" font-size="18" font-weight="700" fill="#20251E">
<tspan x="24" y="922.2">Con aceite de limón, sin yogur</tspan>
</text>
<text id="UI-T-S24-e20" data-source="ORI-MENU-P02" x="24" y="964.3" font-family="Segoe UI" font-size="22" font-weight="700" fill="#20251E">
<tspan x="24" y="964.3">Media ración · 9,50 €</tspan>
</text>
<text id="UI-T-S24-e21" data-source="ORI-MENU-P03" x="24" y="1006.9" font-family="Segoe UI" font-size="22" font-weight="700" fill="#20251E">
<tspan x="24" y="1006.9">Ración · 15,00 €</tspan>
</text>
<text id="UI-T-S24-e22" data-source="ORI-MENU-P02" x="24" y="1045.5" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="24" y="1045.5">Elige la variante; el precio no cambia.</tspan>
</text>
<text id="UI-T-S24-e23" data-source="ORI-COPY-D01-04" x="24" y="1099.6" font-family="Segoe UI" font-size="18" font-weight="400" fill="#53594C">
<tspan x="24" y="1099.6">Declarado en el ejemplo: avellanas (frutos</tspan>
<tspan x="24" y="1125.7">de cáscara). Se ha quitado el yogur de la</tspan>
<tspan x="24" y="1151.8">receta de ejemplo; no se ha confirmado</tspan>
<tspan x="24" y="1177.9">la ausencia de leche. El resto de</tspan>
<tspan x="24" y="1204.0">alérgenos y la elaboración están</tspan>
<tspan x="24" y="1230.1">pendientes.</tspan>
</text>
<text id="UI-T-S24-e24" data-source="ORI-COPY-M01-05" x="24" y="1284.2" font-family="Segoe UI" font-size="18" font-weight="700" fill="#20251E">
<tspan x="24" y="1284.2">Elige la variante</tspan>
</text>
