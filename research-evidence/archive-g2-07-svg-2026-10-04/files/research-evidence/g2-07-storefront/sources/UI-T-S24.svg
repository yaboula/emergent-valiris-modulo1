<rect id="UI-T-S24-e6" x="24" y="154.4" width="342" height="1" rx="0" fill="#CCC6B8"/>
<rect id="UI-T-S24-e7" x="24" y="194.4" width="342" height="136.39999999999998" rx="12" fill="#DDEBBE"/>
<text id="UI-T-S24-e8" data-source="ORI-COPY-M01-10" x="40" y="226.4" font-family="Segoe UI" font-size="18" font-weight="400" fill="#20251E">
<tspan x="40" y="226.4">Los ingredientes y alérgenos son</tspan>
<tspan x="40" y="252.5">ejemplos sin verificar. Esta</tspan>
<tspan x="40" y="278.6">demostración no sirve para decidir</tspan>
<tspan x="40" y="304.7">qué puedes comer.</tspan>
</text>
<text id="UI-T-S24-e9" data-source="ORI-COPY-M01-01" x="24" y="386.8" font-family="Arial Black" font-size="28" font-weight="900" fill="#20251E">
