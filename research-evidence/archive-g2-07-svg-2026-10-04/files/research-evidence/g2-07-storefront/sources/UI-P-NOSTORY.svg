<tspan x="72" y="926.9">y garbanzos se prepara para dos o más; las alubias, la merluza y el pollo tienen su plato</tspan>
<tspan x="72" y="955.9">individual. Puedes pasar una ración al centro o elegir un plato para ti.</tspan>
</text>
